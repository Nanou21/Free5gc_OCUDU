gnb_id: 411
gnb_id_bit_length: 22
gnb_du_id: 1

# Example config for a DU with one 20MHz TDD cell using a USRP as RF frontend.
f1ap:
  addrs: 192.168.56.7
  bind_addrs: 192.168.56.6

f1u:
  socket:
    - bind_addr: 192.168.56.6

ru_sdr:
  device_driver: uhd
  device_args: type=b200,num_recv_frames=64,num_send_frames=64
  srate: 23.04
  otw_format: sc12
  tx_gain: 45
  rx_gain: 45

cell_cfg:
  sector_id: 0011
  dl_arfcn: 650000
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 2
  nof_antennas_dl: 2
  nof_antennas_ul: 2
  pdsch:
    mcs_table: qam256
  pusch:
    mcs_table: qam256
# The USRP clock may introduce some CFO: configure the channel estimator to compensate for it.
# With good clocks (e.g., external ones), the default setup may provide better performance.
expert_phy:
  pusch_channel_estimator_td_strategy: average
  pusch_channel_estimator_cfo_compensation: true

log:
  filename: /tmp/du.log
  all_level: warning

pcap:
  mac_enable: false
  mac_filename: /tmp/du_mac.pcap
  f1ap_enable: false
  f1ap_filename: /tmp/du_f1ap.pcap
  f1u_enable: false
  f1u_filename: /tmp/du_f1u.pcap
